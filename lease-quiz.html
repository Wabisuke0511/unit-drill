<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="リースクイズ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a5f3e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120x120.png">
<link rel="apple-touch-icon" sizes="76x76" href="apple-touch-icon-76x76.png">
<link rel="manifest" href="lease-quiz-manifest.json">
<title>リース業界クイズ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','ヒラギノ角ゴ ProN','Meiryo',sans-serif;
  background:linear-gradient(135deg,#e8f4ed 0%,#edf0fd 100%);min-height:100vh}
.hidden{display:none}
.screen{display:none;min-height:100vh;padding:16px}
.screen.active{display:block}

/* Title */
.title-hero{text-align:center;padding:28px 16px 16px}
.title-icon{font-size:3rem;margin-bottom:6px}
.title-name{font-size:1.8rem;font-weight:900;color:#1a5f3e;
  text-shadow:2px 2px 0 rgba(255,255,255,.9);margin-bottom:4px;letter-spacing:.03em}
.title-sub{font-size:.9rem;color:#555;margin-bottom:22px}
.nickname-bar{text-align:center;margin-bottom:14px;font-size:.95rem;color:#555}
.nickname-bar span{font-weight:bold;color:#1a5f3e}
.nickname-edit-btn{background:none;border:none;cursor:pointer;font-size:.9rem;
  color:#888;padding:2px 6px;border-radius:6px;margin-left:4px}
.section-label{text-align:center;font-size:.95rem;font-weight:bold;color:#1a5f3e;
  margin-bottom:8px;margin-top:4px}

/* Chapter grid */
.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;
  max-width:480px;margin:0 auto 18px}
.ch-btn{padding:8px 10px;border:2.5px solid #a0c8b0;border-radius:14px;
  background:#fff;font-size:.82rem;cursor:pointer;color:#1a5f3e;font-weight:bold;
  transition:.15s;text-align:left;line-height:1.3;
  display:flex;align-items:center;gap:8px}
.ch-btn-text{line-height:1.3;flex:1;min-width:0}
.ch-btn.active{background:#1a5f3e;color:#fff;border-color:#1a5f3e}
.ch-btn.mix{grid-column:1/-1;font-size:.95rem;padding:12px;
  border-color:#7b1fa2;color:#7b1fa2;justify-content:center}
.ch-btn.mix.active{background:#7b1fa2;border-color:#7b1fa2;color:#fff}

/* Count bar */
.count-bar{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.count-btn{padding:9px 20px;border:2.5px solid #a0c8b0;border-radius:22px;
  background:#fff;font-size:1rem;cursor:pointer;color:#1a5f3e;font-weight:bold;transition:.15s}
.count-btn.active{background:#1a5f3e;color:#fff;border-color:#1a5f3e}

/* Big buttons */
.title-btns{display:flex;flex-direction:column;gap:12px;max-width:380px;margin:0 auto;padding-bottom:32px}
.title-btn{width:100%;padding:16px;font-size:1.2rem;font-weight:bold;border:none;
  border-radius:16px;cursor:pointer;font-family:inherit;transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:8px}
.title-btn:active{transform:scale(.97)}
.btn-start{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;
  box-shadow:0 5px 18px rgba(46,125,50,.35)}
.btn-graph{background:linear-gradient(135deg,#7b1fa2,#3949ab);color:#fff;
  box-shadow:0 5px 18px rgba(123,31,162,.3)}

/* Nickname modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.hidden{display:none}
.modal{background:#fff;border-radius:20px;padding:28px 24px;max-width:360px;
  width:100%;box-shadow:0 8px 32px rgba(0,0,0,.18);text-align:center}
.modal h2{font-size:1.2rem;color:#1a5f3e;margin-bottom:8px}
.modal p{font-size:.88rem;color:#666;margin-bottom:16px;line-height:1.5}
.modal-input{width:100%;height:50px;font-size:1.2rem;text-align:center;
  border:2.5px solid #a0c8b0;border-radius:12px;outline:none;padding:0 10px;
  font-family:inherit;margin-bottom:14px}
.modal-input:focus{border-color:#43a047;box-shadow:0 0 0 3px rgba(67,160,71,.2)}
.modal-ok{width:100%;padding:13px;font-size:1.1rem;font-weight:bold;
  background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;border:none;
  border-radius:13px;cursor:pointer;font-family:inherit}

/* Quiz screen */
.quiz-header{display:flex;align-items:center;justify-content:space-between;
  max-width:660px;margin:0 auto 8px;gap:12px}
.quit-btn{padding:8px 14px;background:#fff;border:2px solid #e57373;border-radius:12px;
  font-size:.9rem;font-weight:bold;color:#c62828;cursor:pointer;white-space:nowrap}
.quit-btn:active{transform:scale(.96)}
.prog-label{font-size:.85rem;color:#555;text-align:center}
.progress-wrap{max-width:660px;margin:0 auto 12px}
.progress-bar{background:#d0ead8;border-radius:10px;height:12px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#43a047,#7b1fa2);height:100%;
  transition:width .4s;border-radius:10px}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.1);
  padding:20px 18px;margin-bottom:12px;max-width:660px;margin-left:auto;margin-right:auto}
.q-meta{font-size:.78rem;color:#888;margin-bottom:4px}
.q-text{font-size:1.2rem;font-weight:bold;color:#1a1a1a;margin-bottom:16px;line-height:1.6}

/* Choices */
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{width:100%;padding:13px 16px;border:2.5px solid #c8e6c9;border-radius:14px;
  background:#fff;font-size:1rem;cursor:pointer;font-family:inherit;text-align:left;
  font-weight:bold;color:#333;transition:.15s;line-height:1.4}
.choice-btn:not(.locked):hover{border-color:#43a047;background:#f1f8f1}
.choice-btn:not(.locked):active{transform:scale(.98)}
.choice-btn.correct{background:#e8f5e9;border-color:#2e7d32;color:#2e7d32}
.choice-btn.wrong{background:#ffebee;border-color:#c62828;color:#c62828}
.choice-btn.reveal{background:#e8f5e9;border-color:#2e7d32;color:#2e7d32;opacity:.85}
.choice-btn.locked{cursor:default}

/* Feedback */
.feedback{text-align:center;padding:10px 0 2px;display:none}
.feedback .mark{font-size:1.8rem;font-weight:bold}
.feedback .exp{font-size:.88rem;color:#555;margin-top:4px;line-height:1.5;text-align:left}
.feedback.show{display:block}

/* Next button */
.btn-next{display:none;width:100%;max-width:660px;margin:0 auto;
  padding:15px;font-size:1.1rem;font-weight:bold;border:none;
  border-radius:15px;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#43a047,#1976d2);color:#fff;
  box-shadow:0 4px 12px rgba(67,160,71,.3)}
.btn-next.show{display:block}
.btn-next:active{transform:scale(.97)}

/* Result */
.result-card{text-align:center;padding:20px 16px}
.result-hero{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px;flex-wrap:wrap}
.result-texts{text-align:left}
.result-score{font-size:1.5rem;font-weight:bold;color:#1a5f3e;margin-bottom:2px}
.result-pct{font-size:2.4rem;font-weight:bold;color:#e65100;line-height:1}
.result-pct-label{font-size:.82rem;color:#888;margin-top:2px}
.result-msg{font-size:1rem;color:#555;margin-bottom:14px}
.chap-donut-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;
  max-width:500px;margin:0 auto 14px;text-align:left}
.chap-donut-card{background:#f8fbf8;border-radius:12px;padding:10px 12px;
  display:flex;align-items:center;gap:10px}
.chap-donut-info{flex:1;min-width:0}
.chap-donut-name{font-size:.72rem;color:#666;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap-donut-score{font-size:.88rem;font-weight:bold}
.chap-donut-score.hi{color:#2e7d32}.chap-donut-score.mid{color:#f57c00}.chap-donut-score.lo{color:#c62828}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{padding:13px 24px;font-size:1rem;font-weight:bold;border:none;
  border-radius:13px;cursor:pointer;font-family:inherit;transition:.15s;color:#fff}
.btn:active{transform:scale(.96)}
.btn-retry{background:linear-gradient(135deg,#43a047,#2e7d32)}
.btn-home{background:linear-gradient(135deg,#7b1fa2,#3949ab)}
.save-status{font-size:.82rem;padding:5px 12px;border-radius:8px;display:inline-block;margin-top:8px}
.save-ok{background:#e8f5e9;color:#2e7d32}
.save-fail{background:#ffebee;color:#c62828}

/* Graph screen */
.sub-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;
  max-width:660px;margin-left:auto;margin-right:auto}
.back-btn{padding:8px 14px;background:#fff;border:2px solid #a0c8b0;border-radius:12px;
  font-size:.95rem;font-weight:bold;color:#1a5f3e;cursor:pointer;white-space:nowrap}
.back-btn:active{transform:scale(.96)}
.sub-title{font-size:1.1rem;font-weight:bold;color:#1a5f3e}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  max-width:660px;margin:0 auto 14px}
.stat-box{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);
  padding:12px 8px;text-align:center}
.stat-val{font-size:1.6rem;font-weight:bold;color:#1a5f3e}
.stat-label{font-size:.75rem;color:#666;margin-top:2px}

/* Achievement card (graph screen) */
.achieve-card{background:#fff;border-radius:16px;box-shadow:0 3px 14px rgba(0,0,0,.1);
  padding:16px 20px;max-width:660px;margin:0 auto 14px;
  display:flex;align-items:center;gap:20px}
.achieve-info{flex:1}
.achieve-title{font-size:.82rem;color:#888;font-weight:bold;margin-bottom:4px}
.achieve-fraction{font-size:1.6rem;font-weight:bold;color:#1a5f3e;line-height:1}
.achieve-sub{font-size:.82rem;color:#777;margin-top:4px}
.achieve-pct{font-size:2rem;font-weight:bold;color:#e65100}

/* Chapter donut grid (graph screen) */
.hist-card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);
  padding:14px;max-width:660px;margin:0 auto 14px}
.hist-title{font-size:.95rem;font-weight:bold;color:#1a5f3e;margin-bottom:10px}
.ch-donut-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch-donut-item{display:flex;align-items:center;gap:10px;
  background:#f8fbf8;border-radius:10px;padding:8px 10px}
.ch-donut-texts{flex:1;min-width:0}
.ch-donut-name{font-size:.72rem;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-donut-stat{font-size:.88rem;font-weight:bold;margin-top:1px}
.ch-donut-stat.hi{color:#2e7d32}.ch-donut-stat.mid{color:#f57c00}.ch-donut-stat.lo{color:#c62828}
.ch-donut-plays{font-size:.72rem;color:#aaa}

.hist-table{width:100%;border-collapse:collapse;font-size:.85rem}
.hist-table th{background:#f0f8f2;color:#555;padding:6px;text-align:left;
  border-bottom:2px solid #c8e6c9;white-space:nowrap}
.hist-table td{padding:7px 6px;border-bottom:1px solid #f0f0f0}
.hist-table tr:last-child td{border-bottom:none}
.hpct{font-weight:bold}
.hpct.hi{color:#2e7d32}.hpct.mid{color:#f57c00}.hpct.lo{color:#c62828}
.btn-clear{background:#fff;border:2px solid #f44336;color:#f44336;
  border-radius:10px;padding:7px 16px;font-size:.85rem;font-weight:bold;
  cursor:pointer;margin-top:10px;display:block;margin-left:auto}

@media(max-width:480px){
  .ch-grid{grid-template-columns:1fr}
  .ch-btn.mix{grid-column:1}
  .q-text{font-size:1.05rem}
  .choice-btn{font-size:.92rem;padding:11px 12px}
  .title-name{font-size:1.5rem}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  .chap-donut-grid{grid-template-columns:1fr}
  .ch-donut-grid{grid-template-columns:1fr}
  .result-hero{gap:12px}
}
</style>
</head>
<body>

<!-- TITLE SCREEN -->
<div class="screen active" id="screen-title">
  <div class="title-hero">
    <div class="title-icon">🏢</div>
    <div class="title-name">リース業界クイズ</div>
    <div class="title-sub">「日本で一番やさしいリースの本」で理解を深めよう</div>
  </div>

  <div class="nickname-bar" id="nicknameBar">
    プレイヤー：<span id="nicknameDisplay">（未設定）</span>
    <button class="nickname-edit-btn" onclick="showNicknameModal(true)">✏️</button>
  </div>

  <div class="section-label">📚 チャプターを選ぼう</div>
  <div class="ch-grid" id="chGrid"></div>

  <div class="section-label">🔢 出題範囲</div>
  <div class="count-bar" id="countBar">
    <button class="count-btn active" data-cnt="all">全問</button>
    <button class="count-btn" data-cnt="todo">未了・誤りのみ</button>
  </div>

  <div class="title-btns">
    <button class="title-btn btn-start" onclick="startQuiz()">▶ スタート</button>
    <button class="title-btn btn-graph" onclick="showScreen('graph')">📊 記録を見る</button>
  </div>
</div>

<!-- NICKNAME MODAL -->
<div class="overlay hidden" id="nicknameOverlay">
  <div class="modal">
    <h2>👤 ニックネームを入力</h2>
    <p>同じニックネームを使えば<br>記録が引き継げます</p>
    <input class="modal-input" id="nicknameInput" type="text" maxlength="20"
      placeholder="例：田中" autocomplete="off">
    <button class="modal-ok" onclick="confirmNickname()">決定 ✓</button>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div class="screen" id="screen-quiz">
  <div class="quiz-header">
    <button class="quit-btn" onclick="quitQuiz()">✕ やめる</button>
    <div class="prog-label" id="progLabel"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progFill" style="width:0%"></div>
    </div>
  </div>
  <div id="quizArea"></div>
  <button class="btn-next" id="btnNext" onclick="nextQuestion()">次の問題 →</button>
</div>

<!-- RESULT SCREEN -->
<div class="screen" id="screen-result">
  <div class="card result-card" id="resultCard"></div>
</div>

<!-- GRAPH SCREEN -->
<div class="screen" id="screen-graph">
  <div class="sub-header">
    <button class="back-btn" onclick="showScreen('title')">← もどる</button>
    <span class="sub-title">📊 記録</span>
  </div>
  <div id="graphArea"></div>
</div>

<script>
// ===== QUIZ DATA =====
const CHAPTERS = [
  { id:1, name:'新リース会計基準の全貌' },
  { id:2, name:'リース業界の最新動向' },
  { id:3, name:'リースの基礎知識' },
  { id:4, name:'リースのビジネスモデル' },
  { id:5, name:'リースが利用される業界' },
  { id:6, name:'リース業界から生まれたサービス' },
  { id:7, name:'リース会社の仕事と組織' },
  { id:8, name:'リース業界の全体像' },
  { id:9, name:'リース業界で求められる知識・スキル' },
  { id:10, name:'リース業界の課題と展望' },
];

const ALL_QS = [
// ===== Ch1 =====
{ch:1,q:'新リース会計基準が施行されるのはいつか？',
 c:['2027年4月','2025年1月','2026年10月','2028年3月'],a:0,
 e:'2027年4月から新リース会計基準が施行され、リース業界にとって最大の変革となります。'},
{ch:1,q:'新リース会計基準でリース判定に使う2つのポイントは？',
 c:['「特定」と「支配」','「所有」と「支配」','「特定」と「占有」','「登記」と「管理」'],a:0,
 e:'「資産が特定されている（特定）」かつ「その資産から生まれる経済的利益のほとんどを得られる（支配）」の両方を満たすとリース判定されます。'},
{ch:1,q:'減価償却の方法として正しい組み合わせは？',
 c:['定額法と定率法','定額法と定数法','均等法と逓減法','直線法と曲線法'],a:0,
 e:'定額法は毎年同じ額を費用化、定率法は最初が高く徐々に減少。どちらも最終的には0円になります。'},
{ch:1,q:'リースを「オンバランス」にするとはどういう意味か？',
 c:['貸借対照表に資産・負債として計上すること','リース契約を開始すること','オンライン契約に切り替えること','リース料の支払いを開始すること'],a:0,
 e:'オンバランスとは、リース物件を貸借対照表（バランスシート）に計上すること。新会計基準ではオペレーティング・リースも原則オンバランスになります。'},
{ch:1,q:'新リース会計基準と中小企業の関係について正しいのは？',
 c:['中小企業にはまったく関係ない','即座に全面適用される','2年の猶予期間がある','売上高100億円未満のみ免除'],a:0,
 e:'新リース会計基準は中小企業には適用されません（「企業の規模によって変わるルール」の一つ）。'},
{ch:1,q:'新リース会計基準でリースの定義が拡大された主な内容は？',
 c:['店舗の家賃・駐車場代など実質的なリース取引も対象に','銀行からの融資も対象に','設備の買取も含まれる','フランチャイズ契約も対象に'],a:0,
 e:'旧基準は「建物や設備のリース取引」に限定されていましたが、新基準では実質的なリース取引（家賃・駐車場代など）もすべて対象になりました。'},
{ch:1,q:'旧来のリース会計基準が問題視されていた最大の理由は？',
 c:['グローバルスタンダードとかけ離れていた','税率の計算が複雑だった','中小企業に不利だった','オペレーティング・リースを認めていなかった'],a:0,
 e:'日本のリース会計基準は国際基準（IFRS）とかけ離れており、グローバルに事業展開する企業にとって問題でした。'},
{ch:1,q:'新リース会計基準でリース期間を決める際、延長可能性が高い場合はどう扱うか？',
 c:['延長期間も含めてリース期間として貸借対照表に計上する','延長分は別契約として処理する','延長分は全額経費で処理する','延長の可能性は考慮しない'],a:0,
 e:'賃借期間を延長する可能性が高い場合、その延長期間も含めてリース期間として見積もり、資産として計上する必要があります。'},

// ===== Ch2 =====
{ch:2,q:'サーキュラーエコノミーとリース業界が相性がよい最大の理由は？',
 c:['使用終了後に製品を引き取るためほぼ100%回収できる','リース料が他の手段より安いため','政府の補助金が受けられるため','税制優遇があるため'],a:0,
 e:'リース契約は期間満了後に物件を引き取るため、資源を確実に回収できます。これはサーキュラーエコノミー（循環経済）と非常に相性がよいのです。'},
{ch:2,q:'官公庁がリースを利用する主なメリットは？',
 c:['コスト削減の効果','品質向上','雇用の創出','税収の増加'],a:0,
 e:'官公庁がリースを利用することで、設備の初期費用を抑え、維持管理コストを含めたトータルコストを削減できます。'},
{ch:2,q:'学校でリースが広がっている主な物品として正しいのは？',
 c:['体育館のエアコン・タブレットPC','教科書・給食設備','校舎の建設・プール','バス・給食車'],a:0,
 e:'GIGAスクール構想でのタブレット配備や、体育館のエアコン設置など、教育現場でリースの活用が増えています。'},
{ch:2,q:'リース取引のピーク時（バブル最盛期）の取扱高はいくら？',

// Map each question object → its index in ALL_QS (defined after ALL_QS)
let QS_IDX;
function buildQsIdx() { QS_IDX = new Map(ALL_QS.map((q, i) => [q, i])); }

function getCorrectQs() {
  try { return new Set(JSON.parse(localStorage.getItem(CORRECT_QS_KEY) || '[]')); } catch(e) { return new Set(); }
}
function markQuestionCorrect(q) {
  const s = getCorrectQs();
  s.add(QS_IDX.get(q));
  localStorage.setItem(CORRECT_QS_KEY, JSON.stringify([...s]));
}
function getIncompletePool(chFilter) {
  const done = getCorrectQs();
  const base = chFilter === 'mix' ? ALL_QS : ALL_QS.filter(q => q.ch === parseInt(chFilter));
  return base.filter(q => !done.has(QS_IDX.get(q)));
}

// ===== QUIZ =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  let pool;
  if (selectedCnt === 'todo') {
    pool = shuffle(getIncompletePool(selectedCh));
    if (!pool.length) {
      const label = selectedCh === 'mix' ? '全問題' : `Ch${selectedCh}`;
      alert(`🎉 ${label}の未了・誤り問題はありません！すべて正解済みです。`);
      return;
    }
  } else {
    pool = shuffle(selectedCh === 'mix'
      ? [...ALL_QS]
      : ALL_QS.filter(q => q.ch === parseInt(selectedCh)));
  }
  questions = pool;
  qIdx = 0;
  score = 0;
  chapStats = {};
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[qIdx];
  answered = false;
  const pct = Math.round((qIdx / questions.length) * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = `${qIdx + 1} / ${questions.length}問`;

  const chap = CHAPTERS.find(c => c.id === q.ch);
  const chapLabel = chap ? `Ch${q.ch}: ${chap.name}` : '';

  // Shuffle choices with correct answer tracking
  const idxMap = q.c.map((_, i) => i);
  const shuffled = shuffle(idxMap);
  const newCorrect = shuffled.indexOf(q.a);

  document.getElementById('quizArea').innerHTML = `
    <div class="card">
      <div class="q-meta">${chapLabel}</div>
      <div class="q-text">${q.q}</div>
      <div class="choices" id="choices">
        ${shuffled.map((oi, ni) => `
          <button class="choice-btn" data-ni="${ni}" data-oi="${oi}" onclick="selectChoice(this, ${ni}, ${newCorrect})">
            ${['A','B','C','D'][ni]}. ${q.c[oi]}
          </button>
        `).join('')}
      </div>
      <div class="feedback" id="feedback">
        <div class="mark" id="feedMark"></div>
        <div class="exp" id="feedExp"></div>
      </div>
    </div>
  `;
  document.getElementById('btnNext').classList.remove('show');
}

function selectChoice(btn, chosenNi, correctNi) {
  if (answered) return;
  answered = true;

  const q = questions[qIdx];
  const isCorrect = chosenNi === correctNi;

  // Update chapStats
  if (!chapStats[q.ch]) chapStats[q.ch] = { right: 0, total: 0 };
  chapStats[q.ch].total++;
  if (isCorrect) { score++; chapStats[q.ch].right++; markQuestionCorrect(q); }

  // Style all buttons
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.classList.add('locked');
    const ni = parseInt(b.dataset.ni);
    if (ni === correctNi) b.classList.add(isCorrect && ni === chosenNi ? 'correct' : 'reveal');
    else if (ni === chosenNi) b.classList.add('wrong');
  });

  // Show feedback
  const fb = document.getElementById('feedback');
  document.getElementById('feedMark').textContent = isCorrect ? '⭕ 正解！' : '❌ 不正解';
  document.getElementById('feedMark').style.color = isCorrect ? '#2e7d32' : '#c62828';
  document.getElementById('feedExp').textContent = q.e;
  fb.classList.add('show');

  document.getElementById('btnNext').classList.add('show');
  document.getElementById('btnNext').textContent =
    qIdx + 1 < questions.length ? '次の問題 →' : '結果を見る';
}

function nextQuestion() {
  qIdx++;
  if (qIdx < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
  window.scrollTo(0, 0);
}

function quitQuiz() {
  if (confirm('クイズをやめてタイトルに戻りますか？')) showScreen('title');
}

// ===== DONUT SVG =====
function donutSVG(correct, total, size, large) {
  size = size || 56;
  const pct = total > 0 ? correct / total : 0;
  const r = large ? 36 : 20;
  const sw = large ? 7 : 5.5;
  const circ = 2 * Math.PI * r;
  const filled = pct * circ;
  const color = pct >= 0.7 ? '#2e7d32' : pct >= 0.5 ? '#f57c00' : '#c62828';
  const bg = pct >= 0.7 ? '#c8e6c9' : pct >= 0.5 ? '#ffe0b2' : '#ffcdd2';
  const cx = size / 2, cy = size / 2;
  const fs1 = large ? 13 : 9;
  const fs2 = large ? 9 : 7;
  const y1 = large ? cy - 3 : cy - 2;
  const y2 = large ? cy + 11 : cy + 7;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${bg}" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${filled.toFixed(2)} ${circ.toFixed(2)}"
      stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${y1}" text-anchor="middle" dominant-baseline="central"
      font-size="${fs1}" font-weight="bold" fill="${color}" font-family="sans-serif">${Math.round(pct*100)}%</text>
    <text x="${cx}" y="${y2}" text-anchor="middle"
      font-size="${fs2}" fill="#888" font-family="sans-serif">${correct}/${total}問</text>
  </svg>`;
}

// ===== CHAPTER PROGRESS =====
function getChapterBest() {
  try { return JSON.parse(localStorage.getItem(CH_BEST_KEY) || '{}'); } catch(e) { return {}; }
}

function updateChapterBest(stats) {
  const stored = getChapterBest();
  Object.entries(stats).forEach(([ch, s]) => {
    const id = parseInt(ch);
    const normalized = s.total >= 10 ? s.right : Math.round(s.right / s.total * 10);
    if (!stored[id] || normalized > (stored[id].correct || 0)) {
      stored[id] = { correct: normalized };
    }
  });
  localStorage.setItem(CH_BEST_KEY, JSON.stringify(stored));
}

function chProgressDonut(correct, total, size) {
  const r = (size - 7) / 2;
  const sw = 3.5;
  const circ = 2 * Math.PI * r;
  const pct = total > 0 ? correct / total : 0;
  const filled = pct * circ;
  const color = pct >= 0.7 ? '#2e7d32' : pct >= 0.5 ? '#f57c00' : pct > 0 ? '#c62828' : '#ccc';
  const cx = size / 2, cy = size / 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${filled.toFixed(2)} ${circ.toFixed(2)}"
      stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
      font-size="${Math.round(size * 0.28)}" font-weight="bold"
      fill="currentColor" font-family="sans-serif">${correct}</text>
  </svg>`;
}

function renderChGrid() {

// ===== RESULT =====
async function showResult() {
  showScreen('result');
  const pct = Math.round(score / questions.length * 100);
  const msg = pct >= 90 ? '🎉 完璧！リース業界マスター！' :
              pct >= 70 ? '👍 よくできました！' :
              pct >= 50 ? '📚 もう少し復習しよう' : '💪 再挑戦してみよう';

  // Chapter donut cards
  const chapCards = Object.entries(chapStats).map(([ch, s]) => {
    const chap = CHAPTERS.find(c => c.id === parseInt(ch));
    const p = Math.round(s.right / s.total * 100);
    const cls = p >= 70 ? 'hi' : p >= 50 ? 'mid' : 'lo';
    return `<div class="chap-donut-card">
      ${donutSVG(s.right, s.total, 56)}
      <div class="chap-donut-info">
        <div class="chap-donut-name">Ch${ch}: ${chap ? chap.name : ''}</div>
        <div class="chap-donut-score ${cls}">${s.right}/${s.total}問正解</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('resultCard').innerHTML = `
    <div class="result-hero">
      ${donutSVG(score, questions.length, 110, true)}
      <div class="result-texts">
        <div class="result-score">${questions.length}問中 <strong>${score}問</strong> 正解</div>
        <div class="result-pct">${pct}%</div>
        <div class="result-pct-label">正答率</div>
      </div>
    </div>
    <div class="result-msg">${msg}</div>
    ${chapCards ? `<div class="chap-donut-grid">${chapCards}</div>` : ''}
    <div id="saveStatus"></div>
    <div class="btn-row">
      <button class="btn btn-retry" onclick="startQuiz()">🔄 もう一度</button>
      <button class="btn btn-home" onclick="showScreen('title')">🏠 タイトルへ</button>
    </div>
  `;

  updateChapterBest(chapStats);
  const res = await saveRecord(pct);
  const el = document.getElementById('saveStatus');
  if (el) {
    el.innerHTML = res.ok
      ? '<span class="save-status save-ok">✓ 記録を保存しました</span>'
      : `<span class="save-status save-fail">ローカルに保存しました</span>`;
  }
}

// ===== SUPABASE / LOCAL SAVE =====
function saveLocal(rec) {
  try {
    const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    arr.push(rec);
    if (arr.length > 200) arr.splice(0, arr.length - 200);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  } catch(e) {}
}

async function saveRecord(pct) {
  const chLabel = selectedCh === 'mix' ? '全章ミックス' :
    `Ch${selectedCh}: ${(CHAPTERS.find(c => c.id === parseInt(selectedCh)) || {}).name || ''}`;
  const rec = {
    date: new Date().toISOString(),
    score: pct,
    chapter: chLabel,
    total_q: questions.length,
  };
  saveLocal(rec);
  if (!getNickname()) return { ok: false };
  if (!sbClient) return { ok: false };
  try {
    const { error } = await sbClient.from('lease_quiz_records').insert({
      user_id:   getNickname(),
      score:     pct,
      chapter:   chLabel,
      played_at: rec.date,
      total_q:   questions.length,
    });
    return error ? { ok: false } : { ok: true };
  } catch(e) { return { ok: false }; }
}

// ===== GRAPH =====
async function renderGraph() {
  const area = document.getElementById('graphArea');
  area.innerHTML = '<div style="text-align:center;color:#aaa;padding:32px;">読み込み中...</div>';

  // Load local records
  let records = [];
  try { records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}

  // Fetch from Supabase and merge (so iPhone records appear on PC and vice versa)
  if (sbClient && getNickname()) {
    try {
      const { data, error } = await sbClient
        .from('lease_quiz_records')
        .select('*')
        .eq('user_id', getNickname())
        .order('played_at', { ascending: true })
        .limit(500);
      if (!error && data && data.length) {
        const sbRecs = data.map(r => ({
          date: r.played_at,
          score: r.score,
          chapter: r.chapter,
          total_q: r.total_q,
        }));
        // Merge: Supabase is source of truth; add local-only entries not yet uploaded
        const sbDates = new Set(sbRecs.map(r => r.date));
        const localOnly = records.filter(r => !sbDates.has(r.date));
        records = [...sbRecs, ...localOnly]
          .sort((a, b) => new Date(a.date) - new Date(b.date));
        // Sync merged set back to localStorage
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records.slice(-200)));
      }
    } catch(e) {}
  }

  // Update chapterBest from merged records (chapter-specific plays)
  {
    const bestFromRecords = {};
    records.forEach(r => {
      const m = (r.chapter || '').match(/^Ch(\d+)/);
      if (!m) return;
      const chId = parseInt(m[1]);
      const correct = Math.round((r.score / 100) * (r.total_q || 10));
      const norm = (r.total_q || 10) >= 10 ? correct : Math.round(correct / (r.total_q || 10) * 10);
      if (!bestFromRecords[chId] || norm > bestFromRecords[chId]) bestFromRecords[chId] = norm;
    });
    const stored = getChapterBest();
    let changed = false;
    Object.entries(bestFromRecords).forEach(([ch, correct]) => {
      if (!stored[ch] || correct > (stored[ch].correct || 0)) {
        stored[ch] = { correct };
        changed = true;
      }
    });
    if (changed) localStorage.setItem(CH_BEST_KEY, JSON.stringify(stored));
  }

  if (!records.length) {
    area.innerHTML = '<div style="text-align:center;color:#888;padding:40px;">まだ記録がありません</div>';
    return;
  }

  // 達成率 = 各チャプターの最良正解数合計 / 全100問
  const chBest = getChapterBest();
  const totalCorrect = CHAPTERS.reduce((sum, ch) => sum + (chBest[ch.id]?.correct || 0), 0);
  const totalAllQ = CHAPTERS.length * 10;
  const overallPct = Math.round(totalCorrect / totalAllQ * 100);
  const playCount = records.length;
  const best = Math.max(...records.map(r => r.score));

  // チャプター別集計（正解数・総問数・プレイ回数）
  const byCh = {};
  records.forEach(r => {
    const key = r.chapter || '不明';
    if (!byCh[key]) byCh[key] = { correct: 0, total: 0, cnt: 0 };
    byCh[key].total  += r.total_q || 0;
    byCh[key].correct += Math.round((r.score / 100) * (r.total_q || 0));
    byCh[key].cnt++;
  });

  const chDonutItems = Object.entries(byCh).map(([ch, s]) => {
    const p = s.total ? Math.round(s.correct / s.total * 100) : 0;
    const cls = p >= 70 ? 'hi' : p >= 50 ? 'mid' : 'lo';
    return `<div class="ch-donut-item">
      ${donutSVG(s.correct, s.total, 58)}
      <div class="ch-donut-texts">
        <div class="ch-donut-name">${ch}</div>
        <div class="ch-donut-stat ${cls}">${s.correct}/${s.total}問正解</div>
        <div class="ch-donut-plays">${s.cnt}回プレイ</div>
      </div>
    </div>`;
  }).join('');

  // 最近10件
  const recent = [...records].reverse().slice(0, 10);
  const histRows = recent.map(r => {
    const p = r.score;
    const cls = p >= 70 ? 'hi' : p >= 50 ? 'mid' : 'lo';
    const d = r.date ? new Date(r.date).toLocaleDateString('ja-JP', {month:'numeric',day:'numeric'}) : '';
    const correct = Math.round((p / 100) * (r.total_q || 0));
    return `<tr>
      <td>${d}</td>
      <td style="font-size:.78rem;color:#555">${(r.chapter||'').replace(/^Ch\d+:\s*/,'')}</td>
      <td style="text-align:center">${correct}/${r.total_q}</td>
      <td class="hpct ${cls}" style="text-align:center">${p}%</td>
    </tr>`;
  }).join('');

  area.innerHTML = `
    <div class="achieve-card">
      ${donutSVG(totalCorrect, totalAllQ, 100, true)}
      <div class="achieve-info">
        <div class="achieve-title">達成率（全${totalAllQ}問）</div>
        <div class="achieve-pct">${overallPct}%</div>
        <div class="achieve-fraction">${totalCorrect} / ${totalAllQ}問 正解</div>
        <div class="achieve-sub">全${playCount}回プレイ・最高 ${best}%</div>
      </div>
    </div>

    <div class="hist-card">
      <div class="hist-title">📊 チャプター別 正答率</div>
      <div class="ch-donut-grid">${chDonutItems}</div>
    </div>

    <div class="hist-card">
      <div class="hist-title">🕐 最近の記録</div>
      <table class="hist-table">
        <thead><tr><th>日付</th><th>チャプター</th><th>正解数</th><th>正答率</th></tr></thead>
        <tbody>${histRows}</tbody>
      </table>
      <button class="btn-clear" onclick="clearRecords()">記録を削除</button>
    </div>
  `;
}

function clearRecords() {
  if (!confirm('記録をすべて削除しますか？\n（正解済みフラグもリセットされます）')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(CORRECT_QS_KEY);
  localStorage.removeItem(CH_BEST_KEY);
  renderGraph();
}
